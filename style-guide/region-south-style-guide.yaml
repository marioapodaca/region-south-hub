version: '1.5'
priority_order:
- data_accuracy
- brand_compliance
- readability
- correct_subject_identity
- student_representation
- aesthetic_polish
assets:
  region_south_logo:
    url: https://github.com/marioapodaca/region-south-hub/blob/main/RS-logo.png
    redraw: false
    recolor: false
    distort: false
    stylize: false
    invent: false
    placement: only_when_requested_or_template_defined
    duplicate_branding: false
    omit_if_exact_asset_unavailable: true
  lausd_logo:
    url: https://github.com/marioapodaca/region-south-hub/blob/main/LAUSD_seal.png
    redraw: false
    recolor: false
    distort: false
    stylize: false
    invent: false
    placement: only_when_requested_or_template_defined
    duplicate_branding: false
    omit_if_exact_asset_unavailable: true
  protected_brand_marks:
    applies_to:
    - region_south
    - lausd
    - school_district
    - school
    - program
    - organization
    mark_types:
    - logo
    - seal
    - badge
    - crest
    - emblem
    - wordmark
    invent: false
    redraw: false
    approximate: false
    stylize: false
    reinterpret: false
    reconstruct: false
    decorative_placement: false
    fill_unused_space_with_branding: false
    unrequested_duplicate_branding: false
    omit_if_exact_asset_unavailable: true
  image_generation_instruction: "Do not invent, approximate, redraw, stylize, or add any logo, seal, badge, crest, emblem, district mark, or organizational mark. Use only authentic approved assets provided for the design. If an approved asset cannot be reproduced exactly, omit it."
  lausd_brand_guide: https://communications.lausd.org/apps/pages/index.jsp?uREC_ID=4433467&type=d&pREC_ID=2674581
colors:
  official:
    navy: '#00237A'
    bright_blue: '#0089FF'
    green: '#00602D'
    orange: '#FF4D00'
    gold: '#FF9C00'
    red: '#FF0000'
  regional:
    math:
      south: '#00237A'
      east: '#0089FF'
      north: '#001A5A'
      west: '#6F8FAF'
    ela:
      south: '#FF4D00'
      east: '#FF8A4C'
      north: '#B93600'
      west: '#C97A55'
    science:
      south: '#00602D'
      east: '#5CBF82'
      north: '#003D1D'
      west: '#70947F'
subject_rules:
  math:
    family: blue
    icon: calculator
    anchor: '#00237A'
  ela:
    family: orange
    icon: open_book
    anchor: '#FF4D00'
  science:
    family: green
    icons:
    - beaker
    - flask
    - microscope
    anchor: '#00602D'
terminology:
  P+A:
    full_name: Proficient + Advanced
    source_aliases:
    - PoA
    - Percent Proficient or Advanced
  DFP:
    full_name: Distance from Proficiency
  SP:
    full_name: Science Points
  definitions_required_in_visual:
  - P+A
  - DFP
  - SP
metadata:
  source:
    prompt_if_missing: true
    user_may_omit: true
    never_invent: true
  date:
    prompt_if_missing: true
    user_may_omit: true
    never_invent: true
  approved_date_labels:
  - Data as of
  - Downloaded
  - Results through
templates:
  RS-01: Hero Data
  RS-02: Regional Comparison
  RS-03: Cohort Analysis
  RS-PI: Presentation Infographic Style
presentation_infographic_style:
  applies_to:
  - polished_presentation_graphic
  - instructional_visual
  - framework
  - overview
  - process_graphic
  - priorities_graphic
  - strategy_summary
  - non_data_infographic
  default_aspect_ratio: '16:9'
  dark_mode:
    background: lausd_navy_based
    subtle_gradients: true
    depth: true
    low_contrast_subject_patterns: true
  hierarchy:
    context_line: white
    primary_title: subject_color
    optional_subtitle: white_or_light_neutral
  hero_icon:
    required: true
    subject_identity_rules: true
  panels:
    preferred_count_min: 2
    preferred_count_max: 4
    dark_cards: true
    thin_accent_outlines: true
    consistent_spacing: true
    generous_margins: true
    panel_contents:
    - icon_or_visual_identifier
    - bold_white_heading
    - optional_subject_color_subtitle
    - optional_divider_rule
    - concise_supporting_text_or_bullets
  color_use:
    subject_color_for:
    - titles
    - icons
    - borders
    - rules
    - bullet_markers
    - key_phrases
    navy_primary_structural_color_in_dark_mode: true
  emphasis_text_style:
    bold_subject_colored_lead_phrase: true
    explanatory_text_white_or_light_neutral: true
  decorative_elements:
    low_contrast: true
    secondary_only: true
    nonessential_to_understanding: true
    math:
    - equations
    - graphs
    - coordinate_planes
    - geometric_forms
    ela:
    - books
    - annotation_marks
    - quotation_marks
    - speech_bubbles
    - writing_tools
    science:
    - molecules
    - atomic_forms
    - lab_glassware
    - scientific_instruments
  visual_tone:
    clean: true
    modern: true
    mature: true
    avoid:
    - cartoonish
    - elementary
    - clip_art
    - scrapbook
    - poster_board
  depth_effects:
    subtle_gradients: true
    glow: allowed
    shadow: allowed
    layered_shapes: allowed
    readability_over_effects: true
  alignment:
    strong_alignment: true
    consistent_panel_dimensions: true
    even_spacing: true
    clear_reading_order: true
  footer_and_branding:
    auto_add_footer: false
    auto_add_motto: false
    auto_add_slogan: false
    auto_add_secondary_logo: false
    auto_add_seal: false
    auto_add_badge: false
    auto_add_decorative_brand_mark: false
    include_only_when_requested_or_template_defined: true
  wording:
    preserve_exact_user_wording: true
    rewrite_only_if_requested: true
  override_rules:
    if_visual_contains_data: region_south_data_visualization_rules_override_decorative_infographic_styling
    if_visual_contains_no_data_priority_order:
    - brand_compliance
    - readability
    - correct_subject_identity
    - content_hierarchy
    - aesthetic_polish
  final_validation:
    same_design_family: true
    appropriate_to_specific_content: true
style_transfer_rule:
  when_region_south_visual_supplied_as_reference: true
  reproduce:
  - layout_rhythm
  - hierarchy
  - panel_treatment
  - typography
  - depth
  - icon_treatment
  - decorative_restraint
  do_not_automatically_reproduce:
  - text
  - slogan
  - footer
  - logos
  - icons
  - content_specific_elements
components:
  RS-C01: Key Takeaway
  RS-C02: Metric Callout
  RS-C03: Measure Definition
  RS-C04: Proficiency Benchmark
  RS-C05: Preliminary Trend
  RS-C06: Internal Use Notice
  RS-C07: Data Metadata
  RS-C08: Data Panel
  RS-C09: Region Label
benchmarks:
  DFP: 0
  SP: 65
preliminary_data:
  show_actual_value_if_restricted: false
  use_generalized_direction: true
  use_dashed_or_dotted_trend: true
  label: Preliminary Trend
brand_asset_validation:
  every_visible_mark_authentic_approved_asset: true
  invented_marks_allowed: false
  approximate_marks_allowed: false
  unrequested_duplicate_branding_allowed: false
  decorative_official_looking_marks_allowed: false
  if_asset_cannot_be_reproduced_exactly: omit
core_brand_rule: "An invented or approximated logo is a brand-compliance failure, even if it looks visually appropriate or resembles an official Region South or LAUSD asset."
